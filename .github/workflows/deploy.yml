name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
#
# NOTE: this group is shared with anything else that publishes Pages. A second
# workflow using the same group with cancel-in-progress raced this one on every
# push — whichever started second killed the other — so which build reached
# production was a coin flip. Keep this the only Pages-publishing workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what the lockfile pins, so a production build
      # can't silently resolve different versions than the ones tested.
      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MINT_START_AT: ${{ vars.VITE_MINT_START_AT }}
        run: npm run build

      - name: Build wallet-free Radbro games
        run: npm run build:radbro

      - name: Stage hosted Radbro games
        run: |
          mkdir -p dist/radbro
          cp -R dist-radbro/slots dist/radbro/slots
          cp -R dist-radbro/coinpusher dist/radbro/coinpusher
          test -f dist/radbro/slots/index.html
          test -f dist/radbro/coinpusher/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
