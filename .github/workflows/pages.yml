name: Deploy site to GitHub Pages (manual fallback)

# DISABLED ON PUSH — deploy.yml is the workflow that publishes this site.
#
# This one also triggered on push to main and shares deploy.yml's `pages`
# concurrency group with cancel-in-progress, so the two raced on every push and
# whichever started second cancelled the other. Which build reached production
# was a coin flip, and this one does NOT run `npm run build:radbro`, so every
# time it won the standalone game bundles were missing from the deploy.
#
# Kept as a manual fallback for publishing the site alone. If you run it, note
# that it will not include /radbro/slots or /radbro/coinpusher.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
